<!doctype html>
<html>
<head><meta charset="utf-8"><title>Audit harness</title>
<style>
  body { margin: 0; background: #333; display: flex; justify-content: center; padding: 12px; }
  .frame { border: 2px solid #666; background: #fff; }
  iframe { border: 0; width: 100%; height: 100%; }
  .bar { position: fixed; top: 4px; left: 12px; z-index: 10; }
  .bar button { margin-right: 6px; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button onclick="setMode(320, 760)">320</button>
  <button onclick="setMode(375, 812)">375</button>
  <button onclick="setMode(414, 896)">414</button>
  <button onclick="setMode(600, 900)">600</button>
  <button onclick="setMode(768, 1024)">768</button>
  <button onclick="setMode(1024, 700)">1024</button>
</div>
<div class="frame" id="frame" style="width: 375px; height: 812px;">
  <iframe id="app" src="http://localhost:4320/"></iframe>
</div>
<script>
  function setMode(w, h) {
    const f = document.getElementById('frame');
    f.style.width = w + 'px';
    f.style.height = h + 'px';
    // nudge the inner app so ring the iframe re-evaluates its viewport metrics
    const app = document.getElementById('app');
    app.style.width = '99%';
    setTimeout(() => { app.style.width = '100%'; }, 30);
    window.auditMode = { w, h };
  }
  window.setMode = setMode;
</script>
</body>
</html>
